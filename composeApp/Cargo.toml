[package]
name = "compose-app"
version = "0.1.0"
edition = "2024"

[dependencies]
uniffi = { version = "0.29.4", features = ["tokio"] }
lofty = "0.24.0"
discord-rich-presence = "1.1.0"
thiserror = "2.0"
parking_lot = "0.12"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
# Puntiamo direttamente al branch dev su GitHub (versione 0.8.0 li') invece
# che alla release 0.6.0 su crates.io: quella release ha un conflitto rotto
# tra vergen e vergen-gitcl che le impedisce di compilare (vedi nota piu'
# sotto). Il tentativo precedente con [patch.crates-io] non ha funzionato
# perche' il vincolo di versione "0.6" qui sopra scartava la patch (0.8.0
# non soddisfa "^0.6"): dichiarare direttamente la dipendenza git risolve
# il problema alla radice.
# TLS: rustls (Rust puro) invece di native-tls/OpenSSL, che da Windows non
# si riesce a cross-compilare per Android. webpki-roots = certificati Mozilla
# inclusi nel binario, adatti ad Android. Va messo su TUTTI e tre i crate
# librespot: connect e playback hanno native-tls nei default e lo riattivano.
librespot-core = { git = "https://github.com/librespot-org/librespot", branch = "dev", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", branch = "dev", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", branch = "dev", default-features = false, features = ["rustls-tls-webpki-roots"] }

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Da quando c'e' dentro tutto lo stack di librespot (crypto, TLS, audio), i .so di debug
# non stripped erano enormi - moltiplicato per le 3 architetture nell'universal APK, portava
# l'APK debug a quasi un giga. "debuginfo" toglie solo le info DWARF (non tocca LTO/opt-level,
# quindi la velocita' di compilazione in debug resta la stessa).
[profile.dev]
strip = "debuginfo"
