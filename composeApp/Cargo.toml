[package]
name = "compose-app"
version = "0.1.0"
edition = "2024"

[dependencies]
uniffi = { version = "0.29.4", features = ["tokio"] }
lofty = "0.24.0"
discord-rich-presence = "1.1.0"
thiserror = "2.0"
parking_lot = "0.12"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
# Puntiamo direttamente al branch dev su GitHub (versione 0.8.0 li') invece
# che alla release 0.6.0 su crates.io: quella release ha un conflitto rotto
# tra vergen e vergen-gitcl che le impedisce di compilare (vedi nota piu'
# sotto). Il tentativo precedente con [patch.crates-io] non ha funzionato
# perche' il vincolo di versione "0.6" qui sopra scartava la patch (0.8.0
# non soddisfa "^0.6"): dichiarare direttamente la dipendenza git risolve
# il problema alla radice.
librespot-core = { git = "https://github.com/librespot-org/librespot", branch = "dev" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", branch = "dev" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", branch = "dev" }
# Qualcosa dentro librespot tira dentro openssl-sys, che cercando di
# compilare per Android prova a trovare un OpenSSL di sistema via
# pkg-config e fallisce (non esiste un OpenSSL "per Android" installato su
# Windows). La feature "vendored" fa compilare OpenSSL da sorgente per ogni
# target invece di cercarlo sul sistema: essendo la stessa versione di
# openssl-sys gia' nel grafo (0.9.x), Cargo unifica le feature e la
# compilazione vendored si applica automaticamente ovunque sia usata.
openssl-sys = { version = "0.9", features = ["vendored"] }

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
