name: Build APK

# Builds Tubify for Android (APKs) and iPhone (unsigned IPA) on every push to the tubify
# branches, or on demand from the Actions tab; builds of master are published as a Release.
on:
  push:
    branches: [master, tubify]
  workflow_dispatch:

permissions:
  # write: needed to publish the GitHub Release with the APKs
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same compose-webview revision the upstream release workflow pins.
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  android:
    name: Android debug APK
    # macOS like upstream's prepare-deps job, so compose-webview can publish all its targets.
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout Tubify
        uses: actions/checkout@v7
        with:
          path: app

      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The desktop WebView natives are not needed for Android; the jars only have to resolve.
      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache

      # Fixed signing key, so every new build installs as an update over the previous one.
      # The key lives in the repository; for a private key, move it and the password into
      # repository secrets (KEYSTORE / KEYSTORE_PASSWORD) and they take precedence.
      - name: Configure signing
        working-directory: app/composeApp
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            cp ../keystore/tubify-release.jks release.jks
            PASS="cUUjpcoWjMxV6lF4q6eOAVud"
          fi
          cat >> local.properties <<PROPS
          release.signing.storeFile=$PWD/release.jks
          release.signing.storePassword=$PASS
          release.signing.keyAlias=tubify
          release.signing.keyPassword=$PASS
          PROPS

      - name: Assemble optimized release and debug fallback
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleStableRelease :composeApp:assembleStableDebug -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Collect APKs
        working-directory: app/composeApp/build/outputs/apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in $(find stable/release -name "*.apk"); do
            abi=$(basename "$f" .apk | sed -E 's/^composeApp-stable-//; s/-release.*$//')
            cp "$f" "$GITHUB_WORKSPACE/out/Tubify-$abi.apk"
          done
          debug=$(find stable/debug -name "*universal*.apk" | head -1)
          [ -n "$debug" ] || debug=$(find stable/debug -name "*.apk" | head -1)
          cp "$debug" "$GITHUB_WORKSPACE/out/Tubify-debug-fallback.apk"
          ls -la "$GITHUB_WORKSPACE/out"
          test -n "$(ls $GITHUB_WORKSPACE/out/Tubify-arm64-v8a.apk 2>/dev/null)" || { echo "::error::Missing arm64 APK"; exit 1; }

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v7
        with:
          name: tubify-android-apk
          path: out/Tubify-*.apk
          retention-days: 30

      # Every successful build on master becomes a GitHub Release as soon as the APKs are ready;
      # the iPhone job attaches its IPA to the same release when it finishes (it is slower).
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tubify build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Android:** installa **Tubify-arm64-v8a.apk** (quasi tutti i telefoni recenti) oppure **Tubify-universal.apk** se il primo non si installa.
            **iPhone:** **Tubify-ios.ipa** (compare qualche minuto dopo) non è firmato: installalo con SideStore o AltStore, che lo firmano con il tuo Apple ID (con un Apple ID gratuito va rinnovato ogni 7 giorni).
            Commit: ${{ github.sha }}
          files: |
            out/Tubify-arm64-v8a.apk
            out/Tubify-armeabi-v7a.apk
            out/Tubify-x86_64.apk
            out/Tubify-universal.apk

  ios:
    name: iPhone IPA (unsigned, for sideloading)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout Tubify
        uses: actions/checkout@v7
        with:
          path: app

      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache

      # Unsigned on purpose (no Apple developer account): SideStore / AltStore / Sideloadly
      # re-sign the IPA with the user's own Apple ID when installing it.
      - name: Build unsigned app
        working-directory: app
        env:
          ORG_GRADLE_PROJECT_buildNumber: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        working-directory: app
        run: |
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP" || { echo "::error::No .app produced"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/Tubify-ios.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: tubify-ios-ipa
          path: Tubify-ios.ipa
          retention-days: 30

      # Adds the IPA to the release the Android job already published for this run.
      - name: Attach IPA to release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: Tubify-ios.ipa
