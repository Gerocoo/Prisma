name: Build APK

# Builds Prisma for Android (APKs) and iPhone (unsigned IPA) on every push to the tubify
# branches, or on demand from the Actions tab; builds of master are published as a Release.
on:
  push:
    branches: [master, tubify]
  workflow_dispatch:

permissions:
  # write: needed to publish the GitHub Release with the APKs
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same compose-webview revision the upstream release workflow pins.
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  android:
    name: Android debug APK
    # macOS like upstream's prepare-deps job, so compose-webview can publish all its targets.
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout Prisma
        uses: actions/checkout@v7
        with:
          path: app
          # Full history and tags: the release notes list the changes since the previous build.
          fetch-depth: 0

      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The desktop WebView natives are not needed for Android; the jars only have to resolve.
      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache

      - name: Build patched Millennium (no glass overlay)
        run: app/.github/scripts/build-millennium.sh millennium-src

      # Fixed signing key, so every new build installs as an update over the previous one.
      # The key lives in the repository; for a private key, move it and the password into
      # repository secrets (KEYSTORE / KEYSTORE_PASSWORD) and they take precedence.
      - name: Configure signing
        working-directory: app/composeApp
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE / KEYSTORE_PASSWORD secrets are missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | tr -d '\n\r ' | python3 -c 'import base64,sys; open("release.jks","wb").write(base64.b64decode(sys.stdin.read()))'
          test -s release.jks
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null
          cat >> local.properties <<PROPS
          release.signing.storeFile=$PWD/release.jks
          release.signing.storePassword=$KEYSTORE_PASSWORD
          release.signing.keyAlias=tubify
          release.signing.keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Assemble optimized release and debug fallback
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleStableRelease :composeApp:assembleStableDebug -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Collect APKs
        working-directory: app/composeApp/build/outputs/apk/stable/release
