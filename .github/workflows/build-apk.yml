name: Build APK

# Builds an installable Android debug APK of Tubify on every push to the tubify branches,
# or on demand from the Actions tab.
on:
  push:
    branches: [master, tubify]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same compose-webview revision the upstream release workflow pins.
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  android:
    name: Android debug APK
    # macOS like upstream's prepare-deps job, so compose-webview can publish all its targets.
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout Tubify
        uses: actions/checkout@v7
        with:
          path: app

      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The desktop WebView natives are not needed for Android; the jars only have to resolve.
      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleStableDebug --stacktrace

      - name: Collect APK
        working-directory: app
        run: |
          APK_FILE=$(find composeApp/build/outputs/apk -name "*.apk" -type f | head -1)
          test -n "$APK_FILE" || { echo "::error::No APK produced"; exit 1; }
          cp "$APK_FILE" "$GITHUB_WORKSPACE/Tubify-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tubify-android-apk
          path: Tubify-debug.apk
          retention-days: 30
