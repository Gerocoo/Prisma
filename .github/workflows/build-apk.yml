name: Build APK

# Builds an installable Android debug APK of Tubify on every push to the tubify branches,
# or on demand from the Actions tab.
on:
  push:
    branches: [master, tubify]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same compose-webview revision the upstream release workflow pins.
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  android:
    name: Android debug APK
    # macOS like upstream's prepare-deps job, so compose-webview can publish all its targets.
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout Tubify
        uses: actions/checkout@v7
        with:
          path: app

      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The desktop WebView natives are not needed for Android; the jars only have to resolve.
      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache

      # Fixed signing key, so every new build installs as an update over the previous one.
      # The key lives in the repository; for a private key, move it and the password into
      # repository secrets (KEYSTORE / KEYSTORE_PASSWORD) and they take precedence.
      - name: Configure signing
        working-directory: app/composeApp
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            cp ../keystore/tubify-release.jks release.jks
            PASS="cUUjpcoWjMxV6lF4q6eOAVud"
          fi
          cat >> local.properties <<PROPS
          release.signing.storeFile=$PWD/release.jks
          release.signing.storePassword=$PASS
          release.signing.keyAlias=tubify
          release.signing.keyPassword=$PASS
          PROPS

      - name: Assemble optimized release and debug fallback
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleStableRelease :composeApp:assembleStableDebug -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Collect APKs
        working-directory: app/composeApp/build/outputs/apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in $(find stable/release -name "*.apk"); do
            abi=$(basename "$f" .apk | sed -E 's/^composeApp-stable-//; s/-release.*$//')
            cp "$f" "$GITHUB_WORKSPACE/out/Tubify-$abi.apk"
          done
          debug=$(find stable/debug -name "*universal*.apk" | head -1)
          [ -n "$debug" ] || debug=$(find stable/debug -name "*.apk" | head -1)
          cp "$debug" "$GITHUB_WORKSPACE/out/Tubify-debug-fallback.apk"
          ls -la "$GITHUB_WORKSPACE/out"
          test -n "$(ls $GITHUB_WORKSPACE/out/Tubify-arm64-v8a.apk 2>/dev/null)" || { echo "::error::Missing arm64 APK"; exit 1; }

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v7
        with:
          name: tubify-android-apk
          path: out/Tubify-*.apk
          retention-days: 30
